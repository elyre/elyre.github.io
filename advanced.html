<!DOCTYPE html>
<html lang="en">
    <head>
        <title>Google Advanced Search</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <div class="nav">
            <a href="index.html" class="nav-link">Google Advanced Search</a>
        </div>

        <h1>Find pages with...</h1>

        <div class="advanced">
            <form action="https://www.google.com/search">
                <label for="field1">All these words:</label>
                <input type="text" id="field1" name="field1">

                <label for="field1">This exact word or phrase:</label>
                <input type="text" id="field2" name="field2">

                <label for="field1">Any of these words:</label>
                <input type="text" id="field3" name="field3">

                <label for="field1">None of these words:</label>
                <input type="text" id="field4" name="field4">

                <input type="submit" value="Advanced Search"> #blue
            </form>
        </div>

    </body>
</html>
